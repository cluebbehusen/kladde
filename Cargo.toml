[package]
name = "kladde"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "CLI for a local markdown notebook: daily notes, generic notes, and section-aware appends that are safe under concurrent writers"
repository = "https://github.com/cluebbehusen/kladde"
license = "MIT"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
jiff = "0.2.35"
thiserror = "2.0.19"
toml_edit = "0.25.13"
unicase = "2.9.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
