[package]
name = "kladde"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "CLI for a local markdown notebook, built for coding agents: daily notes, generic notes, and section-aware appends that are safe under concurrent writers"
authors = ["Connor Luebbehusen <connor@luebbehusen.dev>"]
repository = "https://github.com/cluebbehusen/kladde"
homepage = "https://github.com/cluebbehusen/kladde"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "notes", "notebook", "daily-notes", "agent"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    "/.cargo",
    "/.github",
    "/.gitignore",
    "/.prettierrc",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/ROADMAP.md",
    "/deny.toml",
    "/dist-workspace.toml",
    "/docs",
    "/pyproject.toml",
    "/skills",
    "/tests",
]

[dependencies]
caseless = "0.2.2"
clap = { version = "4.6.5", features = ["derive"] }
jiff = "0.2.35"
pulldown-cmark = { version = "0.13.4", default-features = false }
same-file = "1.0.6"
shell-words = "1.1.1"
thiserror = "2.0.19"
toml_edit = "0.25.13"
unicase = "2.9.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
