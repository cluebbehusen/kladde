name: Publish crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Check the planned version against Cargo.toml
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          planned="$(jq -r '.releases[] | select(.app_name == "kladde") | .app_version' <<< "$PLAN")"
          declared="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [[ "$planned" != "$declared" ]]; then
            echo "::error::Planned version (${planned}) does not match Cargo.toml version (${declared})"
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
